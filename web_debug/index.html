<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VSR Web 调试</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #182229;
        background: #f4f7f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1260px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0 40px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 750;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .status {
        color: #60707a;
        font-size: 13px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(560px, 1fr) 380px;
        gap: 18px;
        align-items: start;
      }

      section {
        background: #fff;
        border: 1px solid #d9e2e6;
        border-radius: 8px;
        padding: 16px;
      }

      .stack {
        display: grid;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
        color: #3f4b52;
        font-size: 13px;
        font-weight: 650;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #c6d1d7;
        border-radius: 6px;
        padding: 9px 10px;
        font: inherit;
        color: #172026;
        background: #fff;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 9px 13px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: #176b87;
        color: white;
      }

      button.secondary {
        background: #e8eef1;
        color: #26343b;
      }

      button.danger {
        background: #b93838;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .row > * {
        flex: 1;
      }

      .video-shell {
        position: relative;
        width: 100%;
        background: #11191f;
        border-radius: 8px;
        overflow: hidden;
        aspect-ratio: 16 / 9;
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .overlay {
        position: absolute;
        inset: 0;
        cursor: crosshair;
      }

      .selection,
      .drag-rect {
        position: absolute;
        border: 2px solid #25d0ff;
        background: rgba(37, 208, 255, 0.18);
        pointer-events: none;
      }

      .selection {
        border-color: #ffcc33;
        background: rgba(255, 204, 51, 0.16);
      }

      .empty-video {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #d5e0e5;
        font-size: 14px;
      }

      .video-controls {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .transport {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .transport button {
        flex: none;
        min-width: 46px;
        padding: 8px 10px;
      }

      .time-readout {
        margin-left: auto;
        color: #46545d;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }

      .timeline-row {
        display: grid;
        grid-template-columns: 1fr 84px;
        gap: 10px;
        align-items: center;
      }

      input[type="range"] {
        padding: 0;
        accent-color: #176b87;
      }

      .time-input {
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      .areas {
        display: grid;
        gap: 8px;
        margin: 10px 0 12px;
      }

      .area {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        border: 1px solid #d9e2e6;
        border-radius: 6px;
        padding: 8px;
        font-size: 12px;
        color: #46545d;
        word-break: break-all;
      }

      .jobs {
        display: grid;
        gap: 12px;
      }

      .job {
        border: 1px solid #d9e2e6;
        border-radius: 8px;
        padding: 12px;
        background: #fff;
      }

      .job-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .job-title {
        min-width: 0;
        font-weight: 750;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge {
        flex: none;
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 12px;
        font-weight: 750;
        background: #e8eef1;
        color: #26343b;
      }

      .badge.running {
        background: #d9edf5;
        color: #07506b;
      }

      .badge.succeeded {
        background: #dff1e4;
        color: #18612c;
      }

      .badge.failed,
      .badge.cancelled {
        background: #f7dddd;
        color: #8c2020;
      }

      progress {
        width: 100%;
        height: 14px;
        accent-color: #176b87;
      }

      .meta {
        display: grid;
        gap: 5px;
        margin: 9px 0;
        color: #60707a;
        font-size: 12px;
        word-break: break-all;
      }

      pre {
        max-height: 220px;
        overflow: auto;
        margin: 10px 0 0;
        padding: 10px;
        border-radius: 6px;
        background: #11191f;
        color: #d9e6ec;
        font-size: 12px;
        white-space: pre-wrap;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>VSR Web 调试</h1>
          <div class="status" id="health">检查服务状态中...</div>
        </div>
        <button class="secondary" type="button" id="refresh">刷新任务</button>
      </header>

      <div class="layout">
        <div class="stack">
          <section>
            <h2>视频预览</h2>
            <div class="video-shell" id="video-shell">
              <video id="video" preload="metadata"></video>
              <div class="empty-video" id="empty-video">上传视频后在画面上拖拽选择字幕区域</div>
              <div class="overlay" id="overlay"></div>
            </div>
            <div class="video-controls">
              <div class="transport">
                <button class="secondary" type="button" id="back-5">-5s</button>
                <button class="secondary" type="button" id="back-1">-1s</button>
                <button type="button" id="play">播放</button>
                <button class="secondary" type="button" id="forward-1">+1s</button>
                <button class="secondary" type="button" id="forward-5">+5s</button>
                <span class="time-readout" id="time-readout">00:00.000 / 00:00.000</span>
              </div>
              <div class="timeline-row">
                <input id="timeline" type="range" min="0" max="0" step="0.001" value="0" />
                <input class="time-input" id="time-input" value="0.000" inputmode="decimal" />
              </div>
            </div>
            <div class="areas" id="areas"></div>
            <div class="row">
              <button class="secondary" type="button" id="clear-areas">清空区域</button>
              <button class="secondary" type="button" id="use-bottom">选择底部 20%</button>
            </div>
          </section>

          <section>
            <h2>任务列表</h2>
            <div class="jobs" id="jobs"></div>
          </section>
        </div>

        <section>
          <h2>提交处理</h2>
          <label>
            上传视频
            <input id="file" type="file" accept="video/*" />
          </label>
          <div class="row">
            <label>
              处理模式
              <select id="mode">
                <option value="sttn-auto">sttn-auto</option>
                <option value="sttn-det">sttn-det</option>
                <option value="lama">lama</option>
                <option value="propainter">propainter</option>
                <option value="opencv">opencv</option>
              </select>
            </label>
          </div>
          <label>
            输入路径
            <input id="input-path" />
          </label>
          <label>
            输出路径
            <input id="output-path" />
          </label>
          <label>
            字幕区域
            <textarea id="areas-text" placeholder="每行一个区域：YMIN YMAX XMIN XMAX"></textarea>
          </label>
          <div class="row">
            <button type="button" id="upload">上传</button>
            <button type="button" id="submit">开始去字幕</button>
          </div>
          <div class="status" id="form-status"></div>
        </section>
      </div>
    </main>

    <script>
      const jobsEl = document.querySelector("#jobs");
      const healthEl = document.querySelector("#health");
      const refreshButton = document.querySelector("#refresh");
      const fileInput = document.querySelector("#file");
      const uploadButton = document.querySelector("#upload");
      const submitButton = document.querySelector("#submit");
      const inputPathEl = document.querySelector("#input-path");
      const outputPathEl = document.querySelector("#output-path");
      const modeEl = document.querySelector("#mode");
      const areasTextEl = document.querySelector("#areas-text");
      const formStatusEl = document.querySelector("#form-status");
      const video = document.querySelector("#video");
      const overlay = document.querySelector("#overlay");
      const videoShell = document.querySelector("#video-shell");
      const playButton = document.querySelector("#play");
      const timeline = document.querySelector("#timeline");
      const timeInput = document.querySelector("#time-input");
      const timeReadout = document.querySelector("#time-readout");
      const back5Button = document.querySelector("#back-5");
      const back1Button = document.querySelector("#back-1");
      const forward1Button = document.querySelector("#forward-1");
      const forward5Button = document.querySelector("#forward-5");
      const emptyVideo = document.querySelector("#empty-video");
      const areasEl = document.querySelector("#areas");
      const clearAreasButton = document.querySelector("#clear-areas");
      const useBottomButton = document.querySelector("#use-bottom");

      let areas = [];
      let dragStart = null;
      let dragRect = null;
      let timelineDragging = false;

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      async function requestJson(url, options) {
        const response = await fetch(url, options);
        const text = await response.text();
        const data = text ? JSON.parse(text) : null;
        if (!response.ok) {
          throw new Error(data?.detail || response.statusText);
        }
        return data;
      }

      function parseAreas(value) {
        return value
          .split("\n")
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            const parts = line.split(/[\s,]+/).map(Number);
            if (parts.length !== 4 || parts.some((item) => !Number.isFinite(item))) {
              throw new Error(`字幕区域格式错误：${line}`);
            }
            return parts.map(Math.round);
          });
      }

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) seconds = 0;
        const minutes = Math.floor(seconds / 60);
        const wholeSeconds = Math.floor(seconds % 60);
        const millis = Math.floor((seconds - Math.floor(seconds)) * 1000);
        return `${String(minutes).padStart(2, "0")}:${String(wholeSeconds).padStart(2, "0")}.${String(millis).padStart(3, "0")}`;
      }

      function clampTime(seconds) {
        const duration = Number.isFinite(video.duration) ? video.duration : 0;
        return Math.max(0, Math.min(duration, seconds));
      }

      function updateTimeControls() {
        const duration = Number.isFinite(video.duration) ? video.duration : 0;
        const current = Number.isFinite(video.currentTime) ? video.currentTime : 0;
        timeline.max = String(duration);
        if (!timelineDragging) {
          timeline.value = String(current);
        }
        timeInput.value = current.toFixed(3);
        timeReadout.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
        playButton.textContent = video.paused ? "播放" : "暂停";
      }

      function seekTo(seconds) {
        if (!Number.isFinite(video.duration)) return;
        video.currentTime = clampTime(seconds);
        updateTimeControls();
      }

      function seekBy(delta) {
        seekTo((Number.isFinite(video.currentTime) ? video.currentTime : 0) + delta);
      }

      function syncAreasText() {
        areasTextEl.value = areas.map((area) => area.join(" ")).join("\n");
      }

      function syncAreasFromText() {
        areas = parseAreas(areasTextEl.value);
        renderAreas();
      }

      function getVideoBox() {
        const shellRect = videoShell.getBoundingClientRect();
        const videoWidth = video.videoWidth || 0;
        const videoHeight = video.videoHeight || 0;
        if (!videoWidth || !videoHeight) return null;
        const shellRatio = shellRect.width / shellRect.height;
        const videoRatio = videoWidth / videoHeight;
        let width = shellRect.width;
        let height = shellRect.height;
        let left = 0;
        let top = 0;
        if (shellRatio > videoRatio) {
          width = shellRect.height * videoRatio;
          left = (shellRect.width - width) / 2;
        } else {
          height = shellRect.width / videoRatio;
          top = (shellRect.height - height) / 2;
        }
        return { left, top, width, height, videoWidth, videoHeight };
      }

      function pointerToVideoPoint(event) {
        const box = getVideoBox();
        if (!box) return null;
        const shellRect = videoShell.getBoundingClientRect();
        const x = event.clientX - shellRect.left - box.left;
        const y = event.clientY - shellRect.top - box.top;
        return {
          x: Math.max(0, Math.min(box.width, x)),
          y: Math.max(0, Math.min(box.height, y)),
          box,
        };
      }

      function areaToScreen(area) {
        const box = getVideoBox();
        if (!box) return null;
        const [ymin, ymax, xmin, xmax] = area;
        return {
          left: box.left + (xmin / box.videoWidth) * box.width,
          top: box.top + (ymin / box.videoHeight) * box.height,
          width: ((xmax - xmin) / box.videoWidth) * box.width,
          height: ((ymax - ymin) / box.videoHeight) * box.height,
        };
      }

      function renderAreas() {
        overlay.querySelectorAll(".selection").forEach((item) => item.remove());
        areas.forEach((area) => {
          const rect = areaToScreen(area);
          if (!rect) return;
          const node = document.createElement("div");
          node.className = "selection";
          node.style.left = `${rect.left}px`;
          node.style.top = `${rect.top}px`;
          node.style.width = `${rect.width}px`;
          node.style.height = `${rect.height}px`;
          overlay.appendChild(node);
        });

        areasEl.innerHTML = areas.length
          ? areas
              .map(
                (area, index) => `
                  <div class="area">
                    <span>${index + 1}. ${area.join(" ")}</span>
                    <button class="secondary" type="button" data-remove-area="${index}">删除</button>
                  </div>
                `,
              )
              .join("")
          : "<div class='status'>未选择区域，不传区域会让算法尝试处理全屏文字</div>";
        syncAreasText();
      }

      function drawDragRect(current) {
        if (!dragStart || !current) return;
        if (!dragRect) {
          dragRect = document.createElement("div");
          dragRect.className = "drag-rect";
          overlay.appendChild(dragRect);
        }
        const left = Math.min(dragStart.x, current.x) + dragStart.box.left;
        const top = Math.min(dragStart.y, current.y) + dragStart.box.top;
        const width = Math.abs(current.x - dragStart.x);
        const height = Math.abs(current.y - dragStart.y);
        dragRect.style.left = `${left}px`;
        dragRect.style.top = `${top}px`;
        dragRect.style.width = `${width}px`;
        dragRect.style.height = `${height}px`;
      }

      function finishDrag(current) {
        if (!dragStart || !current) return;
        const box = current.box;
        const xmin = Math.round((Math.min(dragStart.x, current.x) / box.width) * box.videoWidth);
        const xmax = Math.round((Math.max(dragStart.x, current.x) / box.width) * box.videoWidth);
        const ymin = Math.round((Math.min(dragStart.y, current.y) / box.height) * box.videoHeight);
        const ymax = Math.round((Math.max(dragStart.y, current.y) / box.height) * box.videoHeight);
        if (xmax - xmin >= 4 && ymax - ymin >= 4) {
          areas.push([ymin, ymax, xmin, xmax]);
          renderAreas();
        }
      }

      async function loadHealth() {
        try {
          const data = await requestJson("/api/health");
          const accelerator = data.accelerator?.cudaAvailable
            ? `GPU: ${data.accelerator.device} · Torch ${data.accelerator.torch} CUDA ${data.accelerator.torchCuda}`
            : "GPU 未启用";
          healthEl.textContent = `服务正常 · ${accelerator} · workers: ${data.workers}`;
        } catch (error) {
          healthEl.textContent = `服务异常：${error.message}`;
        }
      }

      async function uploadVideo() {
        const file = fileInput.files?.[0];
        if (!file) {
          formStatusEl.textContent = "请选择视频文件";
          return;
        }
        uploadButton.disabled = true;
        formStatusEl.textContent = "上传中...";
        try {
          const formData = new FormData();
          formData.append("file", file);
          const data = await requestJson("/api/uploads", {
            method: "POST",
            body: formData,
          });
          inputPathEl.value = data.input;
          outputPathEl.value = data.output;
          video.src = data.preview_url;
          video.load();
          emptyVideo.hidden = true;
          areas = [];
          renderAreas();
          updateTimeControls();
          formStatusEl.textContent = `已上传：${data.filename}`;
        } catch (error) {
          formStatusEl.textContent = `上传失败：${error.message}`;
        } finally {
          uploadButton.disabled = false;
        }
      }

      function renderJob(job) {
        const canCancel = job.status === "queued" || job.status === "running";
        const outputLink = job.status === "succeeded" ? `<a href="/api/jobs/${job.id}/output">下载输出</a>` : "";
        return `
          <article class="job">
            <div class="job-head">
              <div class="job-title">${escapeHtml(job.input)}</div>
              <span class="badge ${job.status}">${job.status}</span>
            </div>
            <progress max="100" value="${job.progress}"></progress>
            <div class="meta">
              <div>进度：${job.progress}%</div>
              <div>输出：${escapeHtml(job.output)}</div>
              <div>模式：${job.mode}</div>
              <div>区域：${job.areas.length ? escapeHtml(job.areas.map((area) => area.join(" ")).join("；")) : "全屏"}</div>
              ${job.error ? `<div>错误：${escapeHtml(job.error)}</div>` : ""}
              ${outputLink ? `<div>${outputLink}</div>` : ""}
            </div>
            <div class="row">
              <button class="secondary" type="button" data-view="${job.id}">查看日志</button>
              ${canCancel ? `<button class="danger" type="button" data-cancel="${job.id}">取消</button>` : ""}
            </div>
            <pre id="log-${job.id}" hidden>${escapeHtml(job.log.join("\n"))}</pre>
          </article>
        `;
      }

      async function loadJobs() {
        const jobs = await requestJson("/api/jobs");
        jobsEl.innerHTML = jobs.length ? jobs.map(renderJob).join("") : "<div class='status'>暂无任务</div>";
      }

      async function submitJob() {
        try {
          syncAreasFromText();
          const payload = {
            input: inputPathEl.value.trim(),
            output: outputPathEl.value.trim(),
            mode: modeEl.value,
            areas,
          };
          if (!payload.input || !payload.output) {
            formStatusEl.textContent = "请先上传视频，或填写输入/输出路径";
            return;
          }
          submitButton.disabled = true;
          formStatusEl.textContent = "任务提交中...";
          await requestJson("/api/jobs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          formStatusEl.textContent = "任务已提交";
          await loadJobs();
        } catch (error) {
          formStatusEl.textContent = `提交失败：${error.message}`;
        } finally {
          submitButton.disabled = false;
        }
      }

      overlay.addEventListener("pointerdown", (event) => {
        if (!video.videoWidth) return;
        dragStart = pointerToVideoPoint(event);
        overlay.setPointerCapture(event.pointerId);
      });

      overlay.addEventListener("pointermove", (event) => {
        if (!dragStart) return;
        drawDragRect(pointerToVideoPoint(event));
      });

      overlay.addEventListener("pointerup", (event) => {
        if (!dragStart) return;
        finishDrag(pointerToVideoPoint(event));
        dragStart = null;
        dragRect?.remove();
        dragRect = null;
      });

      overlay.addEventListener("pointercancel", () => {
        dragStart = null;
        dragRect?.remove();
        dragRect = null;
      });

      areasEl.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const index = target.dataset.removeArea;
        if (index === undefined) return;
        areas.splice(Number(index), 1);
        renderAreas();
      });

      clearAreasButton.addEventListener("click", () => {
        areas = [];
        renderAreas();
      });

      useBottomButton.addEventListener("click", () => {
        if (!video.videoWidth || !video.videoHeight) {
          formStatusEl.textContent = "请先上传并加载视频";
          return;
        }
        areas = [[Math.round(video.videoHeight * 0.8), video.videoHeight, 0, video.videoWidth]];
        renderAreas();
      });

      playButton.addEventListener("click", async () => {
        if (!video.src) {
          formStatusEl.textContent = "请先上传视频";
          return;
        }
        if (video.paused) {
          await video.play();
        } else {
          video.pause();
        }
        updateTimeControls();
      });

      back5Button.addEventListener("click", () => seekBy(-5));
      back1Button.addEventListener("click", () => seekBy(-1));
      forward1Button.addEventListener("click", () => seekBy(1));
      forward5Button.addEventListener("click", () => seekBy(5));

      timeline.addEventListener("pointerdown", () => {
        timelineDragging = true;
      });

      timeline.addEventListener("input", () => {
        seekTo(Number(timeline.value));
      });

      timeline.addEventListener("pointerup", () => {
        timelineDragging = false;
        seekTo(Number(timeline.value));
      });

      timeInput.addEventListener("change", () => {
        seekTo(Number(timeInput.value));
      });

      video.addEventListener("loadedmetadata", () => {
        renderAreas();
        updateTimeControls();
      });
      video.addEventListener("timeupdate", updateTimeControls);
      video.addEventListener("play", updateTimeControls);
      video.addEventListener("pause", updateTimeControls);
      video.addEventListener("seeked", () => {
        updateTimeControls();
        renderAreas();
      });
      window.addEventListener("resize", renderAreas);
      uploadButton.addEventListener("click", uploadVideo);
      submitButton.addEventListener("click", submitJob);
      refreshButton.addEventListener("click", loadJobs);
      areasTextEl.addEventListener("change", () => {
        try {
          syncAreasFromText();
          formStatusEl.textContent = "";
        } catch (error) {
          formStatusEl.textContent = error.message;
        }
      });

      jobsEl.addEventListener("click", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const viewId = target.dataset.view;
        const cancelId = target.dataset.cancel;
        if (viewId) {
          const log = document.querySelector(`#log-${viewId}`);
          log.hidden = !log.hidden;
        }
        if (cancelId) {
          await requestJson(`/api/jobs/${cancelId}/cancel`, { method: "POST" });
          await loadJobs();
        }
      });

      loadHealth();
      loadJobs();
      setInterval(loadJobs, 2000);
    </script>
  </body>
</html>
